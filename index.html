<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contribution Graph</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--fg:#e6edf3;--mute:#8b949e;--g:#39d353}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
header p{color:var(--mute);margin:0 0 6px}
.demo{display:inline-block;margin-top:8px;padding:6px 10px;border:1px solid #9e6a03;background:#272115;color:#e3b341;border-radius:8px;font-size:13px}
section{margin-top:32px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:18px;margin:0}
section>p{color:var(--mute);margin:2px 0 10px;font-size:14px}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
button:hover{border-color:var(--g)}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.box.term{background:#010409}
canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--line);color:var(--fg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;transform:translate(-50%,-130%);transition:opacity .1s}
</style>
</head>
<body>
<main>
  <header>
    <h1>Contribution graph</h1>
    <p id="meta"></p>
    <div id="demo" class="demo" hidden>Generated demo data. Run <code>node scripts/fetch-github.mjs</code> to load the real calendar.</div>
  </header>
  <div id="root"></div>
</main>

<script src="data/github.js"></script>
<script>
(function(){
/* ---------- data ---------- */
function demo(){
  let s=7; const r=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;
  const now=new Date(); const today=new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()));
  const start=new Date(today); start.setUTCDate(start.getUTCDate()-today.getUTCDay()-52*7);
  const n=52*7+today.getUTCDay()+1, counts=[];
  for(let i=0;i<n;i++){
    const dow=i%7;
    let c=(dow===0||dow===6)?(r()<.45?Math.floor(r()*4):0):(r()<.8?Math.floor(r()*r()*14):0);
    if(i>n-41)c=Math.max(c,1+Math.floor(r()*6));
    counts.push(c);
  }
  counts[Math.floor(n*.55)]=61;
  const nz=counts.filter(c=>c).sort((a,b)=>a-b), q=k=>nz[Math.floor(nz.length*k)];
  const levels=counts.map(c=>!c?0:c<=q(.25)?1:c<=q(.5)?2:c<=q(.75)?3:4).join('');
  return {user:'yasinlatif22-cpu',start:start.toISOString().slice(0,10),total:counts.reduce((a,b)=>a+b,0),counts,levels,demo:true};
}
const D=(typeof window!=='undefined'&&window.GITHUB_DATA)||demo();
const counts=D.counts, n=counts.length, levels=D.levels.split('').map(Number);
const weeks=Math.ceil(n/7), total=D.total, sum=counts.reduce((a,b)=>a+b,0)||1;
const maxC=Math.max(1,...counts), best=counts.indexOf(maxC);
const col=i=>Math.floor(i/7), row=i=>i%7;
const wk=[]; for(let w=0;w<weeks;w++){let t=0;for(let r=0;r<7;r++)t+=counts[w*7+r]||0;wk.push(t);}
const maxW=Math.max(1,...wk);
let e=n-1; if(counts[e]===0)e--; let s=e; while(s>=0&&counts[s]>0)s--;
const streakStart=s+1, streakLen=Math.max(0,e-s), lastOff=s>=0?s:-1;
const dateOf=i=>{const [y,m,d]=D.start.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+i));};
const fmt=i=>dateOf(i).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});

/* ---------- helpers ---------- */
const RAMP=['#161b22','#0e4429','#006d32','#26a641','#39d353'];
const BRIGHT='#56d364';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const easeBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const easeOut=p=>1-Math.pow(1-p,3);
const hex=h=>[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));
const mix=(a,b,p)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')+')';};
const shade=(h,amt)=>amt>=0?mix(h,'#ffffff',amt):mix(h,'#000000',-amt);
function rr(ctx,x,y,sz,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,sz,sz,r);else ctx.rect(x,y,sz,sz);ctx.fill();}
const padOf=w=>Math.min(24,w*0.04);
function gl(w,h,top){const pad=padOf(w),avW=w-pad*2,avH=h-top-pad;const step=Math.min(avW/weeks,avH/7);return {x0:(w-step*weeks)/2,y0:top,step,size:step*0.82,pad};}
const gridH=(w,top)=>Math.round(padOf(w)+top+((w-2*padOf(w))/weeks)*7);
const cellXY=(L,i)=>[L.x0+col(i)*L.step,L.y0+row(i)*L.step];
const FONT='-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif';
const MONO='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

/* ---------- animations: draw(ctx,w,h,t,st), t = ms since start (Infinity = finished frame) ---------- */
const anims=[];

anims.push({title:'1 · The grid',desc:'Cells drop in on a diagonal wave and settle into their real shade. Hover any day.',
  hFn:w=>gridH(w,64),dur:2600,
  draw(ctx,w,h,t,st){
    const L=gl(w,h,64); st.L=L; let landed=0;
    for(let i=0;i<n;i++){
      const [x,y]=cellXY(L,i);
      ctx.fillStyle='#1c222b'; rr(ctx,x,y,L.size,2);
      const d=(col(i)+row(i)*1.6)*22, p=clamp((t-d)/560); if(p<=0)continue;
      if(p>=1)landed+=counts[i];
      const sz=L.size*(0.2+0.8*Math.max(0,easeBack(p))), off=(L.size-sz)/2;
      ctx.fillStyle=p<1?mix(BRIGHT,RAMP[levels[i]],p):RAMP[levels[i]];
      rr(ctx,x+off,y+off,sz,Math.min(2,sz/3));
    }
    const shown=t===Infinity?total:Math.round(landed*total/sum);
    ctx.fillStyle='#e6edf3'; ctx.font='700 34px '+FONT; ctx.textBaseline='alphabetic'; ctx.textAlign='left';
    ctx.fillText(shown.toLocaleString(),L.pad,40);
    const nw=ctx.measureText(shown.toLocaleString()).width;
    ctx.fillStyle='#8b949e'; ctx.font='14px '+FONT; ctx.fillText('contributions in the last year',L.pad+nw+10,40);
  }});

anims.push({title:'2 · Skyline',desc:'Every day is a building. Height is the square root of the count so one huge day does not flatten the rest.',
  hFn:w=>Math.round(Math.max(260,w*0.42)),dur:2600,
  draw(ctx,w,h,t,st){
    const pad=padOf(w), kx=0.35, ky=0.5, dxk=0.3;
    const s=(w-pad*2)/(weeks+6*kx+dxk+0.2), ox=s*kx, oy=s*ky, bw=s*0.8, dx=s*dxk, dy=s*dxk;
    const y0=h-pad-6*oy, maxH=Math.max(30,Math.min(h*0.55,y0-pad-44));
    const x0=pad;
    let bestTop=null;
    for(let r=0;r<7;r++)for(let c=0;c<weeks;c++){
      const i=c*7+r; if(i>=n)continue;
      const bx=x0+c*s+(6-r)*ox, by=y0+r*oy;
      const d=c*14+r*40, p=clamp((t-d)/600);
      const full=counts[i]===0?2:Math.max(3,Math.sqrt(counts[i]/maxC)*maxH);
      const hh=p<=0?0:Math.max(2,full*easeOut(p));
      if(p<=0)continue;
      const base=RAMP[levels[i]]==='#161b22'?'#2a313c':RAMP[levels[i]];
      ctx.fillStyle=base; ctx.fillRect(bx,by-hh,bw,hh);
      ctx.fillStyle=shade(base,0.28); ctx.beginPath();ctx.moveTo(bx,by-hh);ctx.lineTo(bx+bw,by-hh);ctx.lineTo(bx+bw+dx,by-hh-dy);ctx.lineTo(bx+dx,by-hh-dy);ctx.closePath();ctx.fill();
      ctx.fillStyle=shade(base,-0.4); ctx.beginPath();ctx.moveTo(bx+bw,by-hh);ctx.lineTo(bx+bw+dx,by-hh-dy);ctx.lineTo(bx+bw+dx,by-dy);ctx.lineTo(bx+bw,by);ctx.closePath();ctx.fill();
      if(i===best)bestTop=[bx+bw/2+dx/2,by-hh-dy];
    }
    const q=clamp((t-1800)/500);
    if(bestTop&&q>0){
      const ty=pad+16, label='Best day · '+maxC+' on '+fmt(best);
      ctx.globalAlpha=q; ctx.strokeStyle='#8b949e'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(bestTop[0],bestTop[1]-4); ctx.lineTo(bestTop[0],lerp(bestTop[1]-4,ty+6,q)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#e6edf3'; ctx.font='600 13px '+FONT; ctx.textBaseline='alphabetic';
      const tw=ctx.measureText(label).width; const lx=clamp(bestTop[0]-tw/2,pad,w-pad-tw);
      ctx.textAlign='left'; ctx.fillText(label,lx,ty); ctx.globalAlpha=1;
    }
  }});

anims.push({title:'3 · Week by week',desc:'Weekly totals draw as a line, then each week pours down into its seven days.',
  hFn:w=>Math.round(Math.max(290,w*0.55)),dur:3100,
  draw(ctx,w,h,t,st){
    const Lg=gl(w,h,h*0.46); Lg.y0=h-Lg.pad-7*Lg.step;
    const lineTop=Lg.pad+10, lineBot=Math.min(h*0.4,Lg.y0-14);
    const px=k=>Lg.x0+k*Lg.step+Lg.size/2, py=k=>lineBot-(wk[k]/maxW)*(lineBot-lineTop);
    const T=1600, p=clamp(t/T), f=p*(weeks-1), fi=Math.floor(f);
    const alpha=t<=T?1:Math.max(0.3,1-(t-T)/900);
    ctx.globalAlpha=alpha; ctx.strokeStyle='#39d353'; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.beginPath();
    for(let k=0;k<=Math.min(fi,weeks-1);k++){k===0?ctx.moveTo(px(k),py(k)):ctx.lineTo(px(k),py(k));}
    let dot=[px(Math.min(fi,weeks-1)),py(Math.min(fi,weeks-1))];
    if(fi<weeks-1){const fr=f-fi,xx=lerp(px(fi),px(fi+1),fr),yy=lerp(py(fi),py(fi+1),fr);ctx.lineTo(xx,yy);dot=[xx,yy];}
    ctx.stroke(); ctx.globalAlpha=1;
    if(t<T+300){ctx.fillStyle='#56d364';ctx.shadowColor='#39d353';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(dot[0],dot[1],4,0,7);ctx.fill();ctx.shadowBlur=0;}
    for(let i=0;i<n;i++){
      const k=col(i), r=row(i), [cx,cy]=cellXY(Lg,i);
      ctx.fillStyle='#1c222b'; rr(ctx,cx,cy,Lg.size,2);
      const st0=T*(k/(weeks-1))+r*40, q=clamp((t-st0)/650); if(q<=0)continue;
      const e2=easeOut(q), yy=lerp(py(k)-Lg.size/2,cy,e2), xx=lerp(px(k)-Lg.size/2,cx,e2);
      ctx.globalAlpha=Math.min(1,q*2); ctx.fillStyle=RAMP[levels[i]]; rr(ctx,xx,yy,Lg.size,2); ctx.globalAlpha=1;
    }
    ctx.fillStyle='#8b949e'; ctx.font='12px '+FONT; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    ctx.fillText('Busiest week · '+maxW+' contributions',Lg.pad,Lg.pad+2);
  }});

anims.push({title:'4 · Round the year',desc:'The calendar bent into a ring: seven rings for weekdays, one spoke per week, swept by a hand.',
  hFn:w=>Math.round(Math.min(w,520)),dur:3700,
  draw(ctx,w,h,t,st){
    const cx=w/2, cy=h/2, R=Math.min(w,h)/2-14, r0=R*0.3, rs=(R-r0)/7, da=Math.PI*2/weeks, a0=-Math.PI/2;
    const prog=clamp(t/3200), hand=a0+Math.PI*2*prog;
    for(let i=0;i<n;i++){
      const k=col(i), r=row(i), ang0=a0+k*da+0.012, ang1=a0+(k+1)*da-0.012;
      const inner=r0+r*rs+1, outer=r0+(r+1)*rs-1;
      const reach=(k*da)/(Math.PI*2); const q=t===Infinity?1:clamp((prog-reach)*Math.PI*2/ (da*3));
      ctx.globalAlpha=0.35; ctx.fillStyle='#1c222b';
      ctx.beginPath(); ctx.arc(cx,cy,outer,ang0,ang1); ctx.arc(cx,cy,inner,ang1,ang0,true); ctx.closePath(); ctx.fill();
      if(q<=0)continue;
      ctx.globalAlpha=q; ctx.fillStyle=RAMP[levels[i]];
      ctx.beginPath(); ctx.arc(cx,cy,outer,ang0,ang1); ctx.arc(cx,cy,inner,ang1,ang0,true); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha=1;
    if(t<3300){ctx.strokeStyle='rgba(86,211,100,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx+Math.cos(hand)*r0*0.9,cy+Math.sin(hand)*r0*0.9);ctx.lineTo(cx+Math.cos(hand)*R,cy+Math.sin(hand)*R);ctx.stroke();}
    const shown=t===Infinity?total:Math.round(total*prog);
    ctx.textAlign='center'; ctx.fillStyle='#e6edf3'; ctx.font='700 '+Math.round(r0*0.5)+'px '+FONT; ctx.textBaseline='alphabetic';
    ctx.fillText(shown.toLocaleString(),cx,cy+r0*0.12);
    ctx.fillStyle='#8b949e'; ctx.font='12px '+FONT; ctx.fillText('contributions',cx,cy+r0*0.12+18);
  }});

anims.push({title:'5 · The streak',desc:'Everything fades back and a dot runs through your current streak, one day at a time.',
  hFn:w=>gridH(w,56),dur:(()=>{const pd=streakLen?Math.min(34,3600/streakLen):0;return 700+streakLen*pd+700;})(),
  draw(ctx,w,h,t,st){
    const L=gl(w,h,56), pd=streakLen?Math.min(34,3600/streakLen):0;
    const kf=streakLen?clamp((t-700)/pd,0,streakLen-1):0, kc=t===Infinity?streakLen-1:kf;
    const dim=t===Infinity?0.25:1-0.75*clamp(t/500);
    for(let i=0;i<n;i++){
      const [x,y]=cellXY(L,i), k=i-streakStart, inS=k>=0&&k<streakLen;
      const lit=inS&&(t===Infinity||t>=700+k*pd);
      ctx.globalAlpha=inS?(lit?1:dim):dim; ctx.fillStyle=inS?RAMP[levels[i]]:RAMP[levels[i]]; rr(ctx,x,y,L.size,2);
      if(inS&&lit){ctx.globalAlpha=0.9;}
    }
    ctx.globalAlpha=1;
    if(streakLen>0){
      const f0=Math.floor(kc);
      if(t!==Infinity&&t<700+streakLen*pd+200){
        for(let j=8;j>=0;j--){
          const k=f0-j; if(k<0)continue; const [x,y]=cellXY(L,streakStart+k);
          ctx.globalAlpha=(1-j/9)*0.7; ctx.fillStyle='#56d364'; ctx.shadowColor='#39d353'; ctx.shadowBlur=10;
          ctx.beginPath(); ctx.arc(x+L.size/2,y+L.size/2,L.size*0.5*(1-j/12),0,7); ctx.fill();
        }
        ctx.shadowBlur=0; ctx.globalAlpha=1;
      }
    }
    if(lastOff>=0&&(t===Infinity||t>400)){
      const [x,y]=cellXY(L,lastOff), m=L.size*0.22;
      ctx.strokeStyle='#f85149'; ctx.lineWidth=Math.max(1.5,L.size*0.14); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x+m,y+m); ctx.lineTo(x+L.size-m,y+L.size-m); ctx.moveTo(x+L.size-m,y+m); ctx.lineTo(x+m,y+L.size-m); ctx.stroke();
    }
    ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.fillStyle='#e6edf3'; ctx.font='700 30px '+FONT;
    const label=streakLen?('Day '+Math.min(streakLen,Math.floor(kc)+1)):'No active streak';
    ctx.fillText(label,L.pad,34);
    if(streakLen){const lw=ctx.measureText(label).width; ctx.fillStyle='#8b949e'; ctx.font='14px '+FONT; ctx.fillText('of '+streakLen+' · current streak',L.pad+lw+10,34);}
  }});

const GLY=['.',':','+','#','@'];
const termCmd='$ gh contrib '+D.user+' --year';
anims.push({title:'6 · In the terminal',desc:'The command types itself, then every day scrambles and settles into . : + # @ by level.',
  term:true,
  hFn:w=>{const cw=(w-32)/weeks,fs=clamp(cw*1.5,8,16);return Math.round(16+fs*2.8+7*fs*1.3+fs*3.4);},
  dur:(()=>{const cmdEnd=termCmd.length*38;return cmdEnd+250+weeks*28+7*12+380+200+90*22+400;})(),
  draw(ctx,w,h,t,st){
    const pad=16, cw=(w-2*pad)/weeks, fs=clamp(cw*1.5,8,16), rh=fs*1.3;
    ctx.textBaseline='alphabetic'; ctx.font=fs+'px '+MONO; ctx.textAlign='left';
    const cmdEnd=termCmd.length*38, nCmd=Math.min(termCmd.length,Math.floor(t/38));
    ctx.fillStyle='#7ee787'; ctx.fillText(termCmd.slice(0,nCmd),pad,pad+fs);
    const gy=pad+fs*2.8;
    const sumTxt='> '+total.toLocaleString()+' contributions · '+streakLen+'-day streak · best day '+maxC;
    const sumStart=cmdEnd+250+weeks*28+7*12+380+200;
    ctx.textAlign='center';
    for(let i=0;i<n;i++){
      const rs=cmdEnd+250+col(i)*28+row(i)*12; if(t<rs)continue;
      const fin=t>=rs+380; let g;
      if(fin)g=GLY[levels[i]]; else g=GLY[(Math.imul(i,2654435761)+Math.floor(t/70)*40503>>>0)%5];
      ctx.fillStyle=fin?(levels[i]===0?'#30363d':RAMP[levels[i]]):'#8b949e';
      ctx.fillText(g,pad+col(i)*cw+cw/2,gy+row(i)*rh+fs);
    }
    ctx.textAlign='left'; const nSum=t<sumStart?0:Math.min(sumTxt.length,Math.floor((t-sumStart)/22));
    ctx.fillStyle='#e6edf3'; ctx.fillText(sumTxt.slice(0,nSum),pad,gy+7*rh+fs*1.8);
    if(t!==Infinity&&Math.floor(t/450)%2===0){const tw=ctx.measureText(sumTxt.slice(0,nSum)).width;ctx.fillStyle='#e6edf3';ctx.fillRect(pad+tw+3,gy+7*rh+fs*0.8,fs*0.55,fs*1.1);}
  }});

if(typeof window!=='undefined')window.__anims=anims;
if(typeof document==='undefined')return;

/* ---------- runtime ---------- */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('meta').textContent='@'+D.user+' · '+total.toLocaleString()+' contributions in the last year · '+streakLen+'-day current streak';
if(D.demo)document.getElementById('demo').hidden=false;
const root=document.getElementById('root');

anims.forEach((a,idx)=>{
  const sec=document.createElement('section');
  sec.innerHTML='<div class="head"><h2>'+a.title+'</h2><button type="button">Replay</button></div><p>'+a.desc+'</p><div class="box'+(a.term?' term':'')+'"><canvas></canvas><div class="tip"></div></div>';
  root.appendChild(sec);
  const cv=sec.querySelector('canvas'), box=sec.querySelector('.box'), tip=sec.querySelector('.tip'), ctx=cv.getContext('2d');
  const st={}; let w=0,h=0,elapsed=0,last=0,running=false,done=false,started=false,raf=0;
  function render(t){ctx.clearRect(0,0,w,h);ctx.globalAlpha=1;ctx.shadowBlur=0;a.draw(ctx,w,h,t,st);}
  function size(){
    w=box.clientWidth; if(!w)return; h=a.hFn(w);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    cv.style.height=h+'px'; cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    render(reduce||done?Infinity:started?elapsed:0);
  }
  function tick(now){
    if(!running)return; elapsed+=now-last; last=now;
    if(elapsed>=a.dur){render(Infinity);running=false;done=true;return;}
    render(elapsed); raf=requestAnimationFrame(tick);
  }
  function start(){
    cancelAnimationFrame(raf); started=true;
    if(reduce){render(Infinity);done=true;running=false;return;}
    elapsed=0;done=false;running=true;last=performance.now();raf=requestAnimationFrame(tick);
  }
  sec.querySelector('button').addEventListener('click',start);
  new ResizeObserver(size).observe(box);
  new IntersectionObserver(es=>{
    const vis=es[0].isIntersecting;
    if(vis){ if(!started)start(); else if(!done&&!running){running=true;last=performance.now();raf=requestAnimationFrame(tick);} }
    else running=false;
  },{threshold:0.4}).observe(box);
  if(idx===0){
    cv.addEventListener('mousemove',ev=>{
      const L=st.L; if(!L)return; const r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
      const c=Math.floor((x-L.x0)/L.step), rw=Math.floor((y-L.y0)/L.step), i=c*7+rw;
      if(c<0||rw<0||rw>6||i>=n||(x-L.x0)%L.step>L.size||(y-L.y0)%L.step>L.size){tip.style.opacity=0;return;}
      tip.textContent=counts[i]+' contribution'+(counts[i]===1?'':'s')+' · '+fmt(i);
      tip.style.left=(L.x0+c*L.step+L.size/2)+'px'; tip.style.top=(L.y0+rw*L.step)+'px'; tip.style.opacity=1;
    });
    cv.addEventListener('mouseleave',()=>{tip.style.opacity=0;});
  }
});
})();
</script>
</body>
</html>
